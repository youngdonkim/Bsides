<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f3ecdc"/>

  <!-- subtle paper texture dots -->
  <g opacity="0.05">
    <circle cx="180" cy="120" r="1.4" fill="#504128"/>
    <circle cx="320" cy="220" r="1.2" fill="#504128"/>
    <circle cx="980" cy="160" r="1.3" fill="#504128"/>
    <circle cx="1080" cy="480" r="1.5" fill="#504128"/>
    <circle cx="220" cy="510" r="1.2" fill="#504128"/>
  </g>

  <!-- Sticky note top-right (yellow) -->
  <g transform="translate(940 60) rotate(-5)">
    <rect width="200" height="170" fill="#f5e5a7"/>
    <text x="100" y="80" text-anchor="middle" font-family="'Nanum Pen Script', cursive" font-size="34" fill="#2c2620">감성</text>
    <text x="100" y="120" text-anchor="middle" font-family="'Nanum Pen Script', cursive" font-size="34" fill="#2c2620">한 스푼</text>
  </g>

  <!-- Sticky note bottom-left (pink) -->
  <g transform="translate(80 440) rotate(4)">
    <rect width="180" height="140" fill="#f1c7b7"/>
    <text x="90" y="65" text-anchor="middle" font-family="'Nanum Pen Script', cursive" font-size="26" fill="#2c2620">한 사이클</text>
    <text x="90" y="100" text-anchor="middle" font-family="'Nanum Pen Script', cursive" font-size="26" fill="#2c2620">한 멤버</text>
  </g>

  <!-- Brand mark top-left -->
  <g transform="translate(80 80)">
    <text x="0" y="0" font-family="Pretendard, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#2c2620" letter-spacing="-0.5">Bsides</text>
    <circle cx="128" cy="-10" r="6" fill="#5d6b2c"/>
  </g>

  <!-- Main headline -->
  <g transform="translate(80 260)">
    <text x="0" y="0" font-family="Pretendard, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#2c2620" letter-spacing="-1">LLM이 만든</text>
    <text x="0" y="76" font-family="Pretendard, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#2c2620" letter-spacing="-1">그럴듯한 초고 위에,</text>
    <text x="0" y="172" font-family="'Gaegu', 'Nanum Pen Script', cursive" font-size="92" font-weight="700" fill="#5d6b2c">감성 한 스푼.</text>
    <!-- hand underline under '감성 한 스푼.' -->
    <path d="M 0 192 C 90 184, 180 200, 280 188 S 460 184, 530 192" stroke="#5d6b2c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Footer tagline -->
  <text x="80" y="585" font-family="Pretendard, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#2c2620" opacity="0.7">bsides.kr · 혼자가 가능해진 시대, 출시까지 같이 가는 메이커 동아리</text>
</svg>
